# Copyright (C) 2026 Rajesh D'Monte
#
# XcodeGen spec for ArcSeven.
#
#   xcodegen generate        # or: Scripts/bootstrap.sh
#
# ArcSeven.xcodeproj is a build artefact and is git-ignored. This file is the source of
# truth for target membership, build settings, Info.plist contents and entitlements, so
# project-level merge conflicts stop existing.
#
# Naming, for the record: the product is called "ArcSeven" everywhere a human reads it
# (CFBundleName / CFBundleDisplayName / DMG volume). The Xcode target, the Swift module
# and the on-disk bundle are "ArcSeven", because a Swift module name may not begin with
# a digit. Bundle identifier root is com.havokentity.ArcSeven.
#
# Trademark posture: every user-visible string that names 7-Zip must be nominative or
# descriptive ("compatible with", "reimplementation of"). Never possessive, never
# "official". ArcSeven is not affiliated with or endorsed by 7-Zip or Igor Pavlov. That rule
# is why the Services submenu below is titled "ArcSeven" and not "7-Zip".

name: ArcSeven

options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.havokentity
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

attributes:
  ORGANIZATIONNAME: Rajesh D'Monte

configs:
  Debug: debug
  Release: release

fileGroups:
  - LICENSE
  - docs
  - Scripts
  - THIRD_PARTY_LICENSES
  - .swiftlint.yml
  - project.yml
  - Package.swift

# ---------------------------------------------------------------------------------------
# Project-wide build settings
# ---------------------------------------------------------------------------------------
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx

    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Mirrors `strictSettings` in Package.swift so the two build systems agree about what
    # a legal source file is. Existentials must be spelled `any Protocol`.
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny"

    # Universal from the start. Release builds must never be thin: the DMG is one download
    # for both architectures, and the vendored 7zz is lipo'd the same way.
    ARCHS: "$(ARCHS_STANDARD)"

    # Signing.
    #
    # Local builds sign with Developer ID so the Quick Look and Finder extensions
    # actually load: an ad-hoc signature is enough to launch the app, but the system
    # will not register appexes from a bundle it cannot attribute to a team, so
    # "everything works except the extensions" is the symptom of building unsigned.
    #
    # Signing here also means the bundled 7zz helper is signed with the SAME Team ID as
    # the app, which is what satisfies library validation under the hardened runtime —
    # and is why no com.apple.security.cs.* entitlement is needed to spawn it.
    #
    # Contributors without a Developer ID override on the command line:
    #     xcodebuild ... CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
    #
    # Release still goes through Scripts/sign.sh, which re-signs the whole tree
    # inside-out (helper, frameworks, appexes, then the app) and adds --timestamp.
    # Ordering matters and doing it in one place is the only way to keep it right.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: HAMH7N3PJR
    ENABLE_HARDENED_RUNTIME: YES

    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "1"

    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_WEAK: YES
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_NO_COMMON_BLOCKS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    RUN_DOCUMENTATION_COMPILER: NO

    # Warnings we actually want to see in a file manager that does a lot of integer and
    # path arithmetic.
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_WARN_ABOUT_MISSING_NEWLINE: YES
    GCC_WARN_SHADOW: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES

  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      # No --timestamp locally: it round-trips to Apple's timestamp server on every
      # single build. Release adds it in Scripts/sign.sh, where it belongs.
      OTHER_CODE_SIGN_FLAGS: "$(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      GCC_OPTIMIZATION_LEVEL: "0"
      ENABLE_TESTABILITY: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
      # Release symbols are archived next to the DMG so notarisation crash reports
      # symbolicate. Scripts/make-dmg.sh collects the .dSYM bundles.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

# ---------------------------------------------------------------------------------------
# External packages
# ---------------------------------------------------------------------------------------
# Sparkle is the ONLY third-party dependency, and it is deliberately confined to the app
# target. ArchiveCore and FMKit stay dependency-free so `swift build` / `swift test` work
# on a bare checkout with no package resolution — which is what keeps CI green for fork
# pull requests that never receive secrets.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

# ---------------------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------
targets:

  # =====================================================================================
  # The app
  # =====================================================================================
  ArcSeven:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    settings:
      base:
        PRODUCT_NAME: ArcSeven
        PRODUCT_BUNDLE_IDENTIFIER: com.havokentity.ArcSeven
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # The app is deliberately NOT sandboxed. A two-pane file manager that spawns a
        # helper, follows symlinks across volumes, writes xattrs and hands file promises
        # to Finder cannot function inside a container, and the sandbox-inheritance rules
        # would strip the helper of every dynamically acquired PowerBox grant. See
        # docs/ARCHITECTURE.md. Distribution is Developer ID + notarised, not Mac App
        # Store - GPL-3.0 is incompatible with Apple's Licensed Application EULA anyway.
        # com.apple.security.app-sandbox lives in the entitlements block below and
        # nowhere else: setting ENABLE_APP_SANDBOX as well makes Xcode merge two
        # sources for one key, and any disagreement fails at signing time.

    sources:
      # AppKit layer
      - path: Sources/App
        excludes:
          - "Resources/Info.plist"
          - "Resources/ArcSeven.entitlements"
      - path: Sources/FMUI
      - path: Sources/Dialogs
      - path: Sources/SettingsUI
      - path: Sources/Support
      # Pure-logic layer, compiled directly into the app rather than linked as a package
      # product, so there is exactly one copy of these files on disk and `swift test`
      # exercises the same sources the app ships.
      #
      # That means the app is ONE Swift module while SwiftPM sees six. Intra-project
      # `import` lines are therefore wrapped in `#if canImport(...)` (search for
      # "module-guard"): true under SwiftPM, false here, where the types are already in
      # scope. Xcode cannot consume a local package rooted at the project's own
      # directory, so this is the seam that keeps both build systems on one source tree.
      - path: Sources/ArchiveCore
      - path: Sources/FMKit

      # -- Copy Files: the vendored 7-Zip console binary --------------------------------
      # Lands at ArcSeven.app/Contents/Helpers/7zz.
      #
      # Built by vendor/build-7zz.sh (invoked from Scripts/bootstrap.sh) out of the
      # pinned, UNMODIFIED vendor/7zip submodule: an arm64 make, an x86_64 make, then
      # `lipo -create`. It is a separate executable driven as a subprocess and is never
      # linked into this process - with the RAR handlers present, linking would import
      # the unRAR restriction, which is a GPL-incompatible "further restriction" under
      # GPLv3 s7. THIRD_PARTY_LICENSES/7-Zip/VERSION.txt records the upstream COMMIT the
      # binary was built from - not a SHA-256 of the binary, which differs on every build
      # because it is compiled per release rather than mirrored. Per-release checksums
      # live in SHA256SUMS.txt on the GitHub release.
      #
      # `optional: true` so a fresh clone can generate the project before bootstrapping.
      - path: vendor/bin/7zz
        optional: true
        buildPhase:
          copyFiles:
            # `wrapper` is the .app root, NOT Contents/, so the subpath must spell
            # Contents out or the helper lands at ArcSeven.app/Helpers/7zz and the
            # bundle fails `codesign --verify --deep --strict`.
            destination: wrapper
            subpath: Contents/Helpers

      # -- Copy Files: legal notices inside the bundle -----------------------------------
      # GPLv3 s5(d) wants Appropriate Legal Notices reachable from the UI, LGPL-2.1 s6
      # and the 7-Zip license.txt want their text reproduced with any binary
      # redistribution. Shipping them inside Contents/Resources/Legal/ is what the About
      # box and the Acknowledgements pane read from.
      - path: LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Legal
      - path: NOTICE
        optional: true
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Legal
      # `type: folder` makes this a folder REFERENCE, copied wholesale with its structure
      # intact. Without it Xcode copies the contents FLATTENED, so
      # THIRD_PARTY_LICENSES/7-Zip/LICENSE.txt lands as Legal/LICENSE.txt right next to
      # our own GPL LICENSE — two differently-licensed files with confusingly similar
      # names and nothing saying which covers what. Scripts/verify-release.sh checks for
      # the directory precisely because the flattened form is misleading.
      - path: THIRD_PARTY_LICENSES
        type: folder
        optional: true
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Legal

    dependencies:
      # No `embed:` — Xcode embeds a package's dynamic framework into an app target on
      # its own, and LD_RUNPATH_SEARCH_PATHS already carries @executable_path/../Frameworks.
      - package: Sparkle
        product: Sparkle
      - target: QuickLookPreview
        embed: true
      # codeSign: false — the appex is signed by Scripts/sign.sh, inside-out, with its own
      # entitlements. Letting Xcode's embed phase sign it too would apply the host's.
      - target: ArcSevenFinder
        embed: true
        codeSign: false

    entitlements:
      path: Sources/App/Resources/ArcSeven.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Shared with the two appexes: preferences, the authenticated request queue and
        # the extraction staging directory. Team-prefixed, as macOS requires.
        com.apple.security.application-groups:
          - HAMH7N3PJR.group.com.havokentity.ArcSeven
        # Deliberately absent: every com.apple.security.cs.* key. Spawning a co-signed
        # helper needs none of them - library validation governs loaded code, not exec'd
        # processes, and 7zz carries our own Team ID. Verified against shipping Keka,
        # whose entitlements contain zero cs.* keys.

    info:
      path: Sources/App/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: ArcSeven
        CFBundleDisplayName: ArcSeven
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        # False on purpose: a running compress or extract must never be killed silently.
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: >-
          Copyright (C) 2026 Rajesh D'Monte. Licensed under GPL-3.0-or-later, with
          ABSOLUTELY NO WARRANTY. Bundles an unmodified copy of the 7-Zip console binary
          (LGPL-2.1-or-later, BSD-3-Clause, BSD-2-Clause, plus the unRAR restriction).
          ArcSeven is not affiliated with or endorsed by 7-Zip or Igor Pavlov.

        # ---- Sparkle -----------------------------------------------------------------
        # The PUBLIC half of the EdDSA update-signing key. Public by design: it ships in
        # every copy of the app, and its whole job is to let an installed copy verify that
        # an update was signed by the private half. The private half lives only in the
        # maintainer's login Keychain and in the SPARKLE_ED_PRIVATE_KEY secret — it is
        # never committed. See docs/SPARKLE-INTEGRATION.md.
        #
        # Changing this key strands every already-installed copy: they will reject updates
        # signed by the new key, and the only route back is a manual re-download.
        SUPublicEDKey: 5mai3p83QNIAbw/nSEOSkZXeAez+DCurHqGwihqOVhQ=
        #
        # These belong to the APP, not to an extension. Until 0.1.2 this whole block sat in
        # QuickLookPreview's Info.plist, where Sparkle never reads it: the app shipped with
        # no feed URL, so it could not have checked for an update even once.
        #
        # Automatic checks default to OFF and the app asks once, on the second launch. A
        # GPL tool that phones home on first launch without consent is not acceptable.
        SUFeedURL: https://github.com/havokentity/ArcSeven/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400

        # ---- TCC: the app is not sandboxed, so these strings are the consent prompts ----
        NSDesktopFolderUsageDescription: >-
          ArcSeven needs access to your Desktop so it can list, compress and extract files
          stored there.
        NSDocumentsFolderUsageDescription: >-
          ArcSeven needs access to your Documents folder so it can list, compress and
          extract files stored there.
        NSDownloadsFolderUsageDescription: >-
          ArcSeven needs access to your Downloads folder so it can open archives you have
          downloaded and extract them in place.
        NSRemovableVolumesUsageDescription: >-
          ArcSeven needs access to removable volumes so it can browse and extract archives
          stored on external disks.
        NSNetworkVolumesUsageDescription: >-
          ArcSeven needs access to network volumes so it can browse and extract archives
          stored on file servers.

        # ---- Services -------------------------------------------------------------------
        # The Finder-context equivalent of 7-Zip's Explorer shell submenu. The submenu is
        # named "ArcSeven" and the verbs are descriptive, per the trademark rule at the top
        # of this file. Handled by Sources/App/ServicesProvider.swift via
        # NSApplication.shared.servicesProvider.
        #
        # NSSendTypes + NSRequiredContext(FilePath) is the combination verified to work
        # on current macOS; per-verb filtering (is this actually an archive?) happens in
        # the provider, because half the formats 7zz opens have no non-dynamic UTI.
        # The Finder Sync extension is sandboxed and cannot run the bundled 7zz, so it
        # writes a request to the shared container and opens this scheme to hand the
        # work to the app. Paths are NOT encoded in the URL: they contain characters
        # that make that fragile, and a large selection exceeds practical URL limits.
        CFBundleURLTypes:
          - CFBundleURLName: com.havokentity.ArcSeven.request
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - arcseven

        NSServices:
          - NSMenuItem:
              default: ArcSeven/Open Archive
            NSMessage: openArchiveService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath
            NSKeyEquivalent:
              default: ^$O
          - NSMenuItem:
              default: ArcSeven/Extract Here
            NSMessage: extractHereService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath
            NSKeyEquivalent:
              default: ^$X
          - NSMenuItem:
              default: ArcSeven/Extract Loose
            NSMessage: extractLooseService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath
          - NSMenuItem:
              default: ArcSeven/Extract to Subfolder
            NSMessage: extractToSubfolderService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath
          # ---- Removed in 0.1.5: three verbs that were two behaviours ------------------
          #
          # "Extract Files…", "Add to 7z Archive" and "Add to Zip Archive" were declared
          # here and forwarded, in Sources/App/ServicesProvider.swift, to selectors that
          # already had a menu item:
          #
          #   extractFilesService  -> .extract   identical to "Extract Here". No chooser
          #                                      was ever shown, so the ellipsis promised
          #                                      a dialog that does not exist.
          #   addTo7zService       -> .compress  identical to "Add to Archive…".
          #   addToZipService      -> .compress  identical, AND the Compress dialog it
          #                                      opens pre-fills a .7z name regardless
          #                                      (MainWindowController.compressFromFinder),
          #                                      so the one item that named a format named
          #                                      the wrong one.
          #
          # This is the bug 0.1.4 fixed for "Extract Here" vs "Extract to Subfolder": two
          # names for one command teach the user that the names do not mean anything.
          # Deleting the duplicates is the honest half of the fix and it is the half that
          # lives in this file. The other half needs Sources/ and is not ours:
          #
          #   * "Extract Files…" needs a `FinderRequestAction` case that opens the Extract
          #     dialog with a destination chooser, rather than reusing `.extract`, which
          #     is defined as "decide the destination by inspecting the archive".
          #   * "Add to <name>.7z" / "Add to <name>.zip" need the format to survive the
          #     hand-off. `FinderRequestAction` has one `.compress` case carrying no
          #     format, and `compressFromFinder` hard-codes `.7z` on the pre-filled name.
          #     Widening the enum is a contract change - the Finder Sync extension and the
          #     App Group wire format are written against exactly these cases - so it is
          #     one owner's job, not a patch. 7-Zip's own shell menu names the file
          #     ("Add to \"docs.7z\""), which is the target shape.
          #
          # The selectors stay in ServicesProvider.swift. An @objc method nothing declares
          # is inert, and leaving them means restoring these items later is a plist edit.
          - NSMenuItem:
              default: ArcSeven/Add to Archive...
            NSMessage: addToArchiveService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath
            NSKeyEquivalent:
              default: ^$A
          - NSMenuItem:
              default: ArcSeven/Test Archive
            NSMessage: testArchiveService
            NSPortName: ArcSeven
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSTextContent: FilePath

        # ---- Document types ---------------------------------------------------------------
        # Tier A entries below reference UTIs that macOS declares itself, in
        # /System/Library/CoreServices/CoreTypes.bundle. They are referenced only, never
        # redeclared: two apps exporting the same identifier with different conformance
        # makes LaunchServices resolution order-dependent and users get flapping icons.
        #
        # Tier B entries reference UTIs that macOS does NOT declare - they only resolve on
        # a machine where some third-party archiver installed them. Those are declared in
        # UTImportedTypeDeclarations further down. com.rarlab.rar-archive is the one that
        # surprises people: it is a de-facto standard, not a system type.
        #
        # LSHandlerRank is Default for all 24 archive types, and None for the public.data
        # catch-all at the bottom. It is NOT Alternate anywhere, whatever this comment used
        # to say — an Alternate handler never wins a type whose Default handler is present,
        # so an archiver that claimed only Alternate would never open a .7z by double-click
        # on a Mac where Archive Utility already answers for it, which is every Mac.
        #
        # That is a real trade-off rather than a free win: on first launch LaunchServices
        # can hand us types that Archive Utility, Installer or DiskImageMounter were
        # opening before. It is bounded deliberately — the catch-all is `None` so we never
        # become the fallback for arbitrary files, and Scripts/tools/SetDefaultHandler.swift
        # skips .dmg, .pkg, .msi, .jar, .war and public.data, because double-clicking those
        # is *doing something* rather than *looking inside*.
        #
        # CFBundleTypeRole is Editor only for the seven formats 7zz can actually create
        # (7z, zip, tar, gzip, bzip2, xz, wim). Everything else is Viewer - and RAR is
        # Viewer permanently: 7-Zip cannot create RAR either, and the unRAR restriction
        # forbids using that code to write a RAR compressor.
        CFBundleDocumentTypes:
          # ---- Tier A: system-declared -----------------------------------------------
          - CFBundleTypeName: 7z Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-7z.icns
            LSItemContentTypes: [org.7-zip.7-zip-archive]
          - CFBundleTypeName: Zip Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-zip.icns
            LSItemContentTypes: [public.zip-archive]
          - CFBundleTypeName: Tar Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-tar.icns
            LSItemContentTypes: [public.tar-archive]
          - CFBundleTypeName: Gzip Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-gz.icns
            LSItemContentTypes:
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
          - CFBundleTypeName: Bzip2 Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-bz2.icns
            LSItemContentTypes:
              - public.bzip2-archive
              - public.tar-bzip2-archive
          - CFBundleTypeName: XZ Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-xz.icns
            LSItemContentTypes:
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
          - CFBundleTypeName: Compress Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [public.z-archive]
          - CFBundleTypeName: CPIO Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes:
              - public.cpio-archive
              - com.apple.bom-compressed-cpio
          - CFBundleTypeName: Cabinet Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-cab.icns
            LSItemContentTypes: [com.microsoft.cab]
          - CFBundleTypeName: Java Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-zip.icns
            LSItemContentTypes:
              - com.sun.java-archive
              - com.sun.web-application-archive
          - CFBundleTypeName: XAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.apple.xar-archive]
          - CFBundleTypeName: Installer Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.apple.installer-package-archive]
          - CFBundleTypeName: StuffIt Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.allume.stuffit-archive]

          # ---- Tier B: imported below, not system-declared ----------------------------
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-rar.icns
            LSItemContentTypes: [com.rarlab.rar-archive]
          - CFBundleTypeName: LHA Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes:
              - lha
              - public.archive.lha
          - CFBundleTypeName: Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes:
              - public.iso-image
              - com.apple.disk-image-udif
          - CFBundleTypeName: Windows Installer Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.microsoft.msi-installer]
          - CFBundleTypeName: SquashFS Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.plougher.squashfs-archive]
          - CFBundleTypeName: Windows Imaging Format Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.microsoft.wim-archive]
          - CFBundleTypeName: Zstandard Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes:
              - com.facebook.zstandard-archive
              - com.facebook.zstandard-tar-archive
          - CFBundleTypeName: LZ4 Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [public.lz4-archive]
          - CFBundleTypeName: Brotli Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [com.google.brotli-archive]
          - CFBundleTypeName: LZMA Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-generic.icns
            LSItemContentTypes: [org.tukaani.lzma-archive]
          - CFBundleTypeName: ZIPX Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc-zip.icns
            LSItemContentTypes: [com.winzip.zipx-archive]

          # ---- Catch-all -----------------------------------------------------------------
          # 7zz opens far more than the list above, and roughly a third of those formats
          # (.arj, .rpm, .deb, .vhd, .vhdx, .chm, .swm, raw filesystem images) have no
          # declared UTI at all on a stock Mac - LaunchServices synthesises a throwaway
          # dyn.* identifier from the extension, which cannot be matched here and cannot
          # carry an icon. Declaring identifiers for those is Tier C work, tracked
          # separately; until then this entry keeps "Open With > ArcSeven" available for any
          # file whatsoever, which is how the Windows original behaves too.
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.data]

        # ---- Exported types ---------------------------------------------------------------
        # None, and this is deliberate. UTExportedTypeDeclarations means "I am the
        # authority that defines this format". We define none of them. In particular
        # org.7-zip.7-zip-archive belongs to Igor Pavlov and is already system-declared -
        # it is imported below defensively, never exported.

        # ---- Handler rank -----------------------------------------------------------------
        # Default, not Alternate.
        #
        # macOS resolves a document's ICON from the highest-ranked declarer of its type,
        # independently of which app the user picked as the default. With Alternate, .7z
        # files kept Keka's icon even after ArcSeven was made the default handler for
        # them, because Keka declares that type as Default — verified by reading its
        # Info.plist, not guessed. Every other format we claim did pick up our icon, which
        # is what made the single exception legible.
        #
        # Default is the honest claim: "a reasonable handler for this type". It is NOT
        # Owner, which asserts authorship of the format and belongs to whoever defined it
        # — org.7-zip.7-zip-archive is Igor Pavlov's. public.data stays at None: it
        # matches every file with no better type, and claiming any rank on it would put
        # ArcSeven in front of unrelated documents.

        # ---- Imported types ---------------------------------------------------------------
        # Every entry here was verified absent from CoreTypes.bundle: without these
        # declarations the extensions resolve to dyn.* identifiers on a clean install and
        # the document types above never match.
        #
        # Conformance rule: public.data AND public.archive for containers, so the file is
        # both a real file and answers archive-wide queries. Disk images conform to
        # public.disk-image instead of public.archive, matching how the system models
        # public.iso-image.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeIconFile: doc-rar.icns
            UTTypeReferenceURL: https://www.rarlab.com/
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar, rev]
              public.mime-type: [application/x-rar-compressed, application/vnd.rar]
          - UTTypeIdentifier: public.iso-image
            UTTypeDescription: ISO Disk Image
            UTTypeConformsTo: [public.data, public.disk-image]
            UTTypeTagSpecification:
              public.filename-extension: [iso]
              public.mime-type: [application/x-iso9660-image]
          - UTTypeIdentifier: com.apple.disk-image-udif
            UTTypeDescription: Apple Disk Image
            UTTypeConformsTo: [public.data, public.disk-image]
            UTTypeTagSpecification:
              public.filename-extension: [dmg, udif]
              public.mime-type: [application/x-apple-diskimage]
          - UTTypeIdentifier: com.microsoft.msi-installer
            UTTypeDescription: Windows Installer Package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [msi]
              public.mime-type: [application/x-msi]
          - UTTypeIdentifier: com.plougher.squashfs-archive
            UTTypeDescription: SquashFS Image
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [squashfs, sfs, sqsh]
              public.mime-type: [application/x-squashfs]
          - UTTypeIdentifier: com.microsoft.wim-archive
            UTTypeDescription: Windows Imaging Format Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [wim]
              public.mime-type: [application/x-ms-wim]
          - UTTypeIdentifier: com.facebook.zstandard-archive
            UTTypeDescription: Zstandard Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zst]
              public.mime-type: [application/zstd]
          - UTTypeIdentifier: com.facebook.zstandard-tar-archive
            UTTypeDescription: Zstandard Compressed Tar Archive
            UTTypeConformsTo: [com.facebook.zstandard-archive, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [tzst]
          - UTTypeIdentifier: public.lz4-archive
            UTTypeDescription: LZ4 Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lz4]
              public.mime-type: [application/x-lz4]
          - UTTypeIdentifier: com.google.brotli-archive
            UTTypeDescription: Brotli Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [br]
              public.mime-type: [application/x-brotli]
          - UTTypeIdentifier: org.tukaani.lzma-archive
            UTTypeDescription: LZMA Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lzma]
              public.mime-type: [application/x-lzma]
          - UTTypeIdentifier: public.archive.lha
            UTTypeDescription: LHA Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lzh, lha]
              public.mime-type: [application/x-lzh-compressed]
          - UTTypeIdentifier: com.winzip.zipx-archive
            UTTypeDescription: ZIPX Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zipx]
              public.mime-type: [application/x-zipx]
          # Declared even though macOS already declares it, exactly as Keka does:
          # harmless, and it keeps the app's own icon attached to .7z on any machine
          # where a future OS drops the type.
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7z Archive
            UTTypeIconFile: doc-7z.icns
            UTTypeReferenceURL: https://www.7-zip.org/
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
              public.mime-type: [application/x-7z-compressed]

  # =====================================================================================
  # Quick Look preview extension - declared, minimal
  # =====================================================================================
  # Renders the archive LISTING in Finder's preview pane. Sandboxed, and it must stay a
  # header-only parser: it never spawns 7zz, never extracts, and closes the file before
  # rendering. Quick Look previews run in a short-lived, memory-capped host, so anything
  # that decompresses is a hang waiting to happen.
  QuickLookPreview:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        PRODUCT_NAME: QuickLookPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.havokentity.ArcSeven.QuickLookPreview
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
    sources:
      - path: Extensions/QuickLookPreview
        excludes:
          - "Info.plist"
          - "QuickLookPreview.entitlements"
    entitlements:
      path: Extensions/QuickLookPreview/QuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - HAMH7N3PJR.group.com.havokentity.ArcSeven
    info:
      path: Extensions/QuickLookPreview/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: ArcSeven Quick Look
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: >-
          Copyright (C) 2026 Rajesh D'Monte. Licensed under GPL-3.0-or-later.

        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportsSearchableItems: false
            # Only what this extension can actually say something about. Claiming a type
            # and then refusing it is worse than not claiming it: Quick Look picks ONE
            # previewer per type, so every type listed here is one we take away from
            # whatever else on the machine could have rendered it - Keka, BetterZip, or
            # macOS itself - and the user gets a sentence where a file list used to be.
            #
            # This list carried ten types until 0.1.5, and six of them
            # (public.tar-archive, org.gnu.gnu-zip-tar-archive, public.tar-bzip2-archive,
            # org.tukaani.tar-xz-archive, com.rarlab.rar-archive, com.microsoft.cab) could
            # only ever produce "<Format> archives are not previewed here." - the sniffer
            # in ArchiveDirectoryReader routes every one of them to `.known(name:)`, which
            # is the refusal path. Verified by running the real reader over real archives
            # of each type. They are gone.
            #
            # What is left, and why each one earns its place:
            #
            #   public.zip-archive     ZIP stores its directory as plain records at a
            #   com.sun.java-archive   findable offset, so two bounded reads produce a
            #   com.winzip.zipx-archive  real listing. JAR and ZIPX are ZIP containers -
            #                          the reader sniffs magic bytes, not the extension,
            #                          and never looks at the compression method, so a
            #                          method it cannot decompress still lists.
            #
            #   org.7-zip.7-zip-archive  Does NOT list members, and says so. The member
            #                          list lives behind a metadata header this extension
            #                          will not parse (see SevenZipSignatureReader for the
            #                          reasoning). What it does render is real and
            #                          specific: the format, the version, and the fact
            #                          that the signature header passes its own CRC. That
            #                          is strictly more than stock macOS shows for a .7z,
            #                          which is nothing at all, so claiming the type takes
            #                          nothing away from anyone.
            QLSupportedContentTypes:
              - org.7-zip.7-zip-archive
              - public.zip-archive
              - com.sun.java-archive
              - com.winzip.zipx-archive

  # =====================================================================================
  # Quick Actions extension - REMOVED, and there is deliberately no target below
  # =====================================================================================
  # This banner used to introduce a `QuickActions:` target and now introduces nothing. The
  # target was removed because Extensions/QuickActions/ has an Info.plist and entitlements
  # but no code, and an appex with no executable is worse than no appex: it cannot carry
  # entitlements at all, so verify-release.sh correctly failed it as "NOT sandboxed", and
  # the bundle shipped dead weight the system might still try to load. Found by dry-running
  # the release pipeline, not during a release.
  #
  # The intent is still on the roadmap - App Intents backing Finder Quick Actions,
  # Shortcuts, Spotlight and Siri: ExtractArchive, CompressFiles, TestArchive,
  # ListArchiveContents, with the real work handed to the app over the shared app group
  # rather than performed in the extension, because an appex has no business spawning a
  # long-running 7zz. Extensions/QuickActions/README.md says what bringing it back needs.
  #
  # Until someone writes those AppIntent implementations, nothing belongs here. Do not
  # re-add a target for the plist alone.
  # =====================================================================================
  # Finder Sync extension - the top-level right-click menu
  # =====================================================================================
  # This is what gives "Compress with ArcSeven" its own place in the Finder context menu
  # rather than burying it under Services. It is also the one piece the user must switch
  # on by hand: System Settings > General > Login Items & Extensions > Finder Extensions.
  # Until then Finder never loads it and the menu simply is not there, which is a
  # support question, not a bug.
  # NOTE the target name. It must NOT be "FinderSync": the target's own module would
  # then shadow Apple's FinderSync.framework, and `import FinderSync` inside it resolves
  # to itself — failing with "cannot find type 'FIFinderSync' in scope", which reads like
  # a missing import rather than a name collision.
  ArcSevenFinder:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      # FIFinderSync lives in FinderSync.framework and is NOT pulled in by AppKit.
      # Without this the target fails with "cannot find type 'FIFinderSync' in scope",
      # which reads like a missing import rather than a missing link.
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_NAME: ArcSevenFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.havokentity.ArcSeven.FinderSync
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
    sources:
      - path: Extensions/ArcSevenFinder
        excludes:
          - "Info.plist"
          - "ArcSevenFinder.entitlements"
    entitlements:
      path: Extensions/ArcSevenFinder/ArcSevenFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - HAMH7N3PJR.group.com.havokentity.ArcSeven
    info:
      path: Extensions/ArcSevenFinder/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: ArcSeven Finder Extension
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: >-
          Copyright (C) 2026 Rajesh D'Monte. Licensed under GPL-3.0-or-later.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension

